    Comment:
      type: object
      description: Serializer for Comment model using ContentType
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        comment:
          type: string
          maxLength: 255
        commented_on:
          type: string
          format: date-time
          readOnly: true
        commented_by:
          allOf:
          - $ref: '#/components/schemas/CommentUser'
          readOnly: true
        content_type:
          type: string
          title: Python model class name
          readOnly: true
        object_id:
          type: string
          format: uuid
        org:
          type: string
          format: uuid
        is_internal:
          type: boolean
      required:
      - comment
      - commented_by
      - commented_on
      - content_type
      - id
      - object_id
      - org
    CommentUser:
      type: object
      description: Simplified user serializer for comments
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_details:
          type: string
          readOnly: true
      required:
      - id
      - user_details
    Contact:
      type: object
      description: Serializer for reading Contact data
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone:
          type: string
          nullable: true
          pattern: ^[\d\s\-\(\)\+\.]{7,25}$
          maxLength: 25
        organization:
          type: string
          nullable: true
          title: Company
          maxLength: 255
        title:
          type: string
          nullable: true
          title: Job Title
          maxLength: 255
        department:
          type: string
          nullable: true
          maxLength: 255
        do_not_call:
          type: boolean
        linkedin_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        address_line:
          type: string
          nullable: true
          title: Address
          maxLength: 255
        city:
          type: string
          nullable: true
          maxLength: 255
        state:
          type: string
          nullable: true
          maxLength: 255
        postcode:
          type: string
          nullable: true
          title: Postal Code
          maxLength: 64
        country:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CountryEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        assigned_to:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
          readOnly: true
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Teams'
          readOnly: true
        tags:
          type: array
          items:
            type: string
            format: uuid
        description:
          type: string
          nullable: true
          title: Notes
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        org:
          $ref: '#/components/schemas/Organization'
        account:
          type: string
          format: uuid
          nullable: true
          description: Primary account this contact belongs to
        contact_attachment:
          type: array
          items:
            $ref: '#/components/schemas/Attachments'
          readOnly: true
        custom_fields:
          description: Per-org schema extension; values are validated against common.CustomFieldDefinition.
      required:
      - assigned_to
      - contact_attachment
      - created_at
      - first_name
      - id
      - last_name
      - org
      - teams
