    TimeEntry:
      type: object
      description: Read shape for time entries. See docs/cases/tier3/time-tracking.md.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        case:
          type: string
          format: uuid
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the timer is running.
        duration_minutes:
          type: integer
          readOnly: true
          description: Recomputed on save when both timestamps are present.
        description:
          type: string
        billable:
          type: boolean
        hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Snapshot at log time so future rate changes do not alter history.
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        invoice:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Set when this entry has been pushed to a draft invoice.
        auto_stopped:
          type: boolean
          readOnly: true
          description: Set by the auto-stop Celery task when a forgotten timer is
            killed.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
      required:
      - auto_stopped
      - case
      - created_at
      - duration_minutes
      - id
      - invoice
      - profile
      - started_at
      - updated_at
    TimeEntryCreateRequest:
      type: object
      description: |-
        Manual time entry creation (POST /api/cases/<pk>/time-entries/).

        `case`, `profile`, and `org` are injected by the view and not accepted
        from the client. Validation rejects negative durations and negative
        hourly rates so the DB CheckConstraint is a backstop, not the first
        line of defense.
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the timer is running.
        description:
          type: string
        billable:
          type: boolean
        hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Snapshot at log time so future rate changes do not alter history.
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - started_at
    TimeEntryUpdateRequest:
      type: object
      description: |-
        Update path for /api/time-entries/<pk>/.

        Lets the owner (or an admin) revise the start/end window, description,
        billable flag, and hourly rate. `case`, `profile`, and `invoice` stay
        read-only — moving an entry between cases or stealing someone else's
        timer is intentionally not supported.
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Null while the timer is running.
        description:
          type: string
        billable:
          type: boolean
        hourly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Snapshot at log time so future rate changes do not alter history.
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
      required:
      - started_at
