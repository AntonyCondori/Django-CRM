    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - VIEW
      - COMMENT
      - ASSIGN
      - STATUS_CHANGED
      - PRIORITY_CHANGED
      - ROUTED
      - ESCALATED
      - REOPENED
      - MERGED
      - MERGE_TARGET
      - UNMERGED
      - UNMERGE_TARGET
      - LINKED_SOLUTION
      - UNLINKED_SOLUTION
      - WATCHED
      - UNWATCHED
      - MENTIONED
      - APPROVAL_REQUESTED
      - APPROVED
      - REJECTED
      - APPROVAL_CANCELLED
      - LINKED_ASSET
      - UNLINKED_ASSET
      - LINKED_JIRA
      - LINKED_PARENT
      - UNLINKED_PARENT
      - PARENT_CLOSED_CASCADE
      - TIME_LOGGED
      type: string
      description: |-
        * `CREATE` - Created
        * `UPDATE` - Updated
        * `DELETE` - Deleted
        * `VIEW` - Viewed
        * `COMMENT` - Commented
        * `ASSIGN` - Assigned
        * `STATUS_CHANGED` - Status Changed
        * `PRIORITY_CHANGED` - Priority Changed
        * `ROUTED` - Routed
        * `ESCALATED` - Escalated
        * `REOPENED` - Reopened
        * `MERGED` - Merged
        * `MERGE_TARGET` - Merge Target
        * `UNMERGED` - Unmerged
        * `UNMERGE_TARGET` - Unmerge Target
        * `LINKED_SOLUTION` - Linked Solution
        * `UNLINKED_SOLUTION` - Unlinked Solution
        * `WATCHED` - Watched
        * `UNWATCHED` - Unwatched
        * `MENTIONED` - Mentioned
        * `APPROVAL_REQUESTED` - Approval Requested
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `APPROVAL_CANCELLED` - Approval Cancelled
        * `LINKED_ASSET` - Linked Asset
        * `UNLINKED_ASSET` - Unlinked Asset
        * `LINKED_JIRA` - Linked Jira
        * `LINKED_PARENT` - Linked Parent
        * `UNLINKED_PARENT` - Unlinked Parent
        * `PARENT_CLOSED_CASCADE` - Parent Closed Cascade
        * `TIME_LOGGED` - Time Logged
