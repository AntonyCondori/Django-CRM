openapi: 3.0.3
info:
  title: BottleCRM API
  version: 1.0.0
  description: Open source CRM application
paths:
  /api/accounts/:
    get:
      operationId: accounts_list
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      - in: header
        name: org
        schema:
          type: string
      - in: query
        name: tags
        schema:
          type: string
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    post:
      operationId: accounts_create
      parameters:
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/accounts/{id}/:
    get:
      operationId: accounts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    post:
      operationId: accounts_add_comment
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDetailEditSwaggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDetailEditSwaggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDetailEditSwaggerRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: accounts_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    patch:
      operationId: accounts_partial_update
      description: Partial Account Update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountWriteRequest'
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    delete:
      operationId: accounts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/{id}/create_mail/:
    post:
      operationId: accounts_create_mail_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailWrite'
          description: ''
  /api/accounts/attachment/{id}/:
    delete:
      operationId: accounts_attachment_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/comment/{id}/:
    put:
      operationId: accounts_comment_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCommentEditSwaggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountCommentEditSwaggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountCommentEditSwaggerRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCommentEditSwagger'
          description: ''
    patch:
      operationId: accounts_comment_partial_update
      description: Partial Comment Update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountCommentEditSwaggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountCommentEditSwaggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountCommentEditSwaggerRequest'
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCommentEditSwagger'
          description: ''
    delete:
      operationId: accounts_comment_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/activities/:
    get:
      operationId: activities_list
      description: |-
        Get recent activities for the organization
        Returns the last 10 activities by default
      parameters:
      - in: query
        name: entity_type
        schema:
          type: string
        description: Filter by entity type (Account, Lead, Contact, etc.)
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Number of activities to return (default: 10, max: 50)'
      - in: header
        name: org
        schema:
          type: string
      tags:
      - activities
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
          description: ''
  /api/api-settings/:
    get:
      operationId: api_settings_list
      parameters:
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Settings
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListResponse'
          description: ''
    post:
      operationId: api_settings_create
      parameters:
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APISettingsSwaggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APISettingsSwaggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APISettingsSwaggerRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainCreateResponse'
          description: ''
  /api/api-settings/{id}/:
    get:
      operationId: api_settings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Settings
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDetailResponse'
          description: ''
    put:
      operationId: api_settings_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APISettingsSwaggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APISettingsSwaggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APISettingsSwaggerRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainUpdateResponse'
          description: ''
    patch:
      operationId: api_settings_partial_update
      description: Partial API Settings Update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAPISettingsSwaggerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAPISettingsSwaggerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAPISettingsSwaggerRequest'
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPatchResponse'
          description: ''
    delete:
      operationId: api_settings_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: header
        name: org
        schema:
          type: string
      tags:
      - Settings
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDeleteResponse'
          description: ''
  /api/auth/google/:
    post:
      operationId: auth_google_create
      description: |-
        Handle Google Sign-In from mobile apps using ID token.
        Mobile app sends Google ID token, backend verifies and returns JWT.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleIdTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleIdTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleIdTokenRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleIdTokenResponse'
          description: ''
  /api/auth/google/callback/:
    post:
      operationId: auth_google_callback_create
      description: Handle Google OAuth authorization code exchange with PKCE.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleOAuthResponse'
          description: ''
  /api/auth/magic-link/request/:
    post:
      operationId: auth_magic_link_request_create
      description: |-
        Request a magic link for passwordless login/registration.
        Always returns 200 to prevent email enumeration.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MagicLinkRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MagicLinkRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkRequestResponse'
          description: ''
  /api/auth/magic-link/verify/:
    post:
      operationId: auth_magic_link_verify_create
      description: |-
        Verify a magic link token and return JWT tokens.
        Creates a new user if the email doesn't exist.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkVerifyResponse'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Get current authenticated user with organizations
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Get profile for current user in specified organization
      parameters:
      - in: header
        name: org
        schema:
          type: string
          format: uuid
        description: Organization ID
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
          description: ''
  /api/auth/refresh-token/:
    post:
      operationId: auth_refresh_token_create
      description: Refresh access token with org membership validation
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgAwareTokenRefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrgAwareTokenRefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrgAwareTokenRefreshRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgAwareTokenRefreshResponse'
          description: ''
  /api/auth/switch-org/:
    post:
      operationId: auth_switch_org_create
      description: Switch to a different organization and get new JWT tokens
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSwitchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrgSwitchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrgSwitchRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgSwitchResponse'
          description: ''
  /api/boards/:
    get:
      operationId: boards_list
      description: List all boards for the user's organization
      parameters:
      - in: query
        name: archived
        schema:
          type: boolean
        description: Filter archived boards
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Search in board name
      tags:
      - Boards
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardList'
          description: ''
    post:
      operationId: boards_create
      description: Create a new board with default columns
      parameters:
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/boards/{board_pk}/columns/:
    get:
      operationId: boards_columns_list
      description: List all columns for a board
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardColumn'
          description: ''
    post:
      operationId: boards_columns_create
      description: Create a new column
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardColumnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardColumnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardColumnRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumn'
          description: ''
  /api/boards/{id}/:
    get:
      operationId: boards_retrieve
      description: Get board details with columns and tasks
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    put:
      operationId: boards_update
      description: Update board
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardRequest'
        required: true
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    patch:
      operationId: boards_partial_update
      description: Partial Board Update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBoardRequest'
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    delete:
      operationId: boards_destroy
      description: Delete board (owner only)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/boards/columns/{column_pk}/tasks/:
    get:
      operationId: boards_columns_tasks_list
      description: List all tasks for a column
      parameters:
      - in: path
        name: column_pk
        schema:
          type: string
        required: true
      - in: query
        name: org
        schema:
          type: string
        description: Organization ID
        required: true
      tags:
      - Boards
      security:
      - jwtAuth: []
      - APIKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardTask'
          description: ''
    post:
      operationId: boards_columns_tasks_create
